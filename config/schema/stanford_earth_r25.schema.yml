stanford_earth_r25_location.*:
  type: config_entity
  label: 'Stanford Earth R25 Location'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    spud_name:
      type: string
      label: '25Live Publisher Webname'
    space_id:
      type: string
      label: 'R25 Location ID'
    email_list:
      type: string
      label: 'Email List'
    updated:
      type: string
      label: 'Last updated on'
    displaytype:
      type: int
      label: 'Location Display Options'
    caltype:
      type: int
      label: 'Calendar Display Type'
    max_hours:
      type: int
      label: 'Maximum Reservation Hours'
    default_view:
      type: int
      label: 'Default Calendar View'
    description_as_title:
      type: boolean
      label: 'Show Event Description as Title'
    permalink:
      type: boolean
      label: 'Display Calendar Permalink on Page'
    honor_blackouts:
      type: boolean
      label: 'Honor Blackout Dates for Reservations'
    override_blackout_instructions:
      type: string
      label: 'Override Blackout Instructions'
    approver_secgroup_name:
      type: string
      label: 'Approver Security Group'
    approver_secgroup_id:
      type: int
      label: 'R25 Approver Security Group ID'
    email_cancellations:
      type: boolean
      label: 'Email Cancellations to Approvers'
    multi_day:
      type: boolean
      label: 'Allow Multi-Day Reservations'
    postprocess_booking:
      type: boolean
      label: 'Postprocess Booking'
    override_booking_instructions:
      type: string
      label: 'Override Booking Instructions'
    legend_labels:
      type: string
      label: 'Multi-Room Legend Labels'
    event_attributes:
      type: string
      label: 'Event Attributes'
    event_attributes_fields:
      type: sequence
      label: 'Event Attribute R25 Info'
      sequence:
        - type: mapping
          label: 'R25 Event Attr'
          mapping:
            attr_id:
              type: string
              label: 'Event Attr ID'
            name:
              type: string
              label: 'Event Attr Name'
            r25_type:
              type: string
              label: 'Event Attr Type'
            contact:
              type: boolean
              label: 'Contact attribute'
    contact_attribute:
      type: string
      label: 'Contact Attribute'
    contact_attribute_field:
      type: sequence
      label: 'Contact Attribute R25 Info'
      sequence:
        - type: mapping
          label: 'R25 Contact Attr'
          mapping:
            attr_id:
              type: string
              label: 'Contact Attr ID'
            name:
              type: string
              label: 'Contact Attr Name'
            r25_type:
              type: string
              label: 'Contact Attr Type'
            contact:
              type: boolean
              label: 'Contact attribute'
    auto_billing_code:
      type: string
      label: 'Auto-Bill Rate Group ID'
    override_view_roles:
      type: sequence
      label: 'Override View Roles'
      sequence:
        type: string
        label: 'Drupal Role'
    override_book_roles:
      type: sequence
      label: 'Override Book Roles'
      sequence:
        type: string
        label: 'Drupal Role'
    nopopup_reservation_form:
      type: boolean
      label: 'No Pop-up Reservation Form'
    hide_titles_for_non_managers:
      type: boolean
      label: 'Hide Event Labels Unless Authorized'
    override_organization_id:
      type: string
      label: 'Organization ID for This Location'
    override_event_code:
      type: string
      label: 'Event Type for This Location'
    allowed_dates:
      type: sequence
      label: 'Date ranges allowed for booking'
      sequence:
        - type: mapping
          label: 'Date range dates'
          mapping:
            start:
              type: string
              label: 'Start'
            end:
              type: string
              label: 'End'
    allowed_timeslots:
      type: sequence
      label: 'Timeslots allowed for booking'
      sequence:
        - type: mapping
          label: 'Timeslot'
          mapping:
            days:
              type: sequence
              label: 'Allowed Days'
              sequence:
                - type: mapping
                  label: 'Days'
                  mapping:
                    day:
                      type: string
                      label: 'Day'
            start:
              type: string
              label: 'Start Time'
            end:
              type: string
              label: 'End Time'
            price:
              type: string
              label: 'Price'
    location_info:
      type: sequence
      label: 'R25 Location Info'
      sequence:
        - type: mapping
          label: 'R25 Location Info'
          mapping:
            capacity:
              type: string
              label: 'Capacity'
            comments:
              type: string
              label: 'Comments'
            layout_name:
              type: string
              label: 'Layout Name'
            layout_instructions:
              type: string
              label: 'Layout Instructions'
            layout_features:
              type: string
              label: 'Layout Features'
            layout_categories:
              type: string
              label: 'Layout Categories'
            photo_id:
              type: string
              label: 'Photo ID'
    location_type:
      type: int
      label: 'R25 Location Type'
